<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile</title>
    <!-- Font & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --sub-text-color: #64748b;
            --card-bg: #ffffff;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --transition: all 0.25s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 40px 20px; line-height: 1.6; }
        .container { max-width: 680px; margin: 0 auto; }
        
        .profile-card { 
            background: var(--card-bg); 
            padding: 36px 24px; 
            border-radius: 24px; 
            text-align: center; 
            box-shadow: var(--shadow); 
            margin-bottom: 24px; 
            border: 1px solid #f1f5f9;
        }
        
        .avatar { 
            width: 110px; 
            height: 110px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 4px solid #fff; 
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2); 
        }
        
        .profile-card h1 { font-size: 1.75rem; font-weight: 700; color: #0f172a; margin: 12px 0 4px; }
        .profile-card p { color: var(--sub-text-color); font-size: 0.95rem; font-weight: 500; }
        
        .section { 
            background: var(--card-bg); 
            padding: 28px; 
            border-radius: 24px; 
            box-shadow: var(--shadow); 
            margin-bottom: 24px; 
            border: 1px solid #f1f5f9;
        }
        
        .section-title { 
            font-size: 1.25rem; 
            font-weight: 700; 
            color: #0f172a; 
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .section-title i { color: var(--primary-color); }

        .update-item { padding: 14px 0; border-bottom: 1px solid #f1f5f9; }
        .update-item:last-child { border-bottom: none; }
        
        .update-date { 
            font-size: 0.8rem; 
            color: var(--primary-color); 
            font-weight: 700; 
            background: #eff6ff; 
            padding: 2px 8px; 
            border-radius: 6px; 
            display: inline-block; 
            margin-bottom: 6px; 
        }
        
        .update-text { font-size: 0.95rem; color: #334155; }

        .contact-links { display: flex; flex-direction: column; gap: 12px; }
        
        .btn-link { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 14px 20px; 
            background-color: var(--primary-color); 
            color: #fff; 
            text-decoration: none; 
            border-radius: 14px; 
            font-weight: 600; 
            gap: 10px; 
            transition: var(--transition);
        }
        .btn-link:hover { transform: translateY(-2px); opacity: 0.95; }
        .btn-link.zalo { background-color: #0068ff; }
        .btn-link.telegram { background-color: #229ed9; }
        .btn-link.email { background-color: #0f172a; }

        footer { text-align: center; font-size: 0.85rem; color: var(--sub-text-color); margin-top: 32px; }
        footer a { color: var(--primary-color); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile Header -->
        <div class="profile-card">
            <img id="admin-avatar" src="https://files.catbox.moe/e4uo1m.jpg" alt="Avatar Admin" class="avatar">
            <h1 id="admin-name">Đang tải...</h1>
            <p id="admin-bio">...</p>
        </div>

        <!-- Cập nhật mới nhất -->
        <div class="section">
            <h2 class="section-title"><i class="fa-solid fa-bullhorn"></i> Cập nhật mới nhất</h2>
            <div id="updates-list">Đang tải dữ liệu...</div>
        </div>

        <!-- Phương thức liên lạc -->
        <div class="section">
            <h2 class="section-title"><i class="fa-solid fa-paper-plane"></i> Phương thức liên hệ</h2>
            <div class="contact-links">
                <a id="link-zalo" href="#" target="_blank" class="btn-link zalo">
                    <i class="fa-solid fa-comment-dots"></i> Nhắn qua Zalo
                </a>
                <a id="link-telegram" href="#" target="_blank" class="btn-link telegram">
                    <i class="fa-brands fa-telegram"></i> Nhắn qua Telegram
                </a>
                <a id="link-email" href="#" class="btn-link email">
                    <i class="fa-solid fa-envelope"></i> Gửi Email
                </a>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 Admin Profile. Hosted on <a href="https://github.com/Profile-K/my-profile" target="_blank">GitHub Pages</a>.</p>
        </footer>
    </div>

    <!-- Tự động cập nhật dữ liệu từ npoint.io -->
    <script>
        // THAY LINK API NPOINT CỦA BẠN VÀO DÒNG DƯỚI ĐÂY
        const NPOINT_URL = "https://api.npoint.io/7f85bd31715e45b956a5"; 

        fetch(NPOINT_URL)
            .then(response => response.json())
            .then(data => {
                // Nạp avatar, tên và mô tả
                if(data.avatar) document.getElementById('admin-avatar').src = data.avatar;
                document.getElementById('admin-name').innerText = data.name;
                document.getElementById('admin-bio').innerText = data.bio;

                // Nạp danh sách cập nhật
                const updatesContainer = document.getElementById('updates-list');
                updatesContainer.innerHTML = '';
                data.updates.forEach(item => {
                    updatesContainer.innerHTML += `
                        <div class="update-item">
                            <span class="update-date">${item.date}</span>
                            <p class="update-text">${item.text}</p>
                        </div>
                    `;
                });

                // Nạp liên hệ
                document.getElementById('link-zalo').href = data.contacts.zalo;
                document.getElementById('link-telegram').href = data.contacts.telegram;
                document.getElementById('link-email').href = data.contacts.email;
            })
            .catch(error => {
                console.error("Lỗi kết nối npoint.io:", error);
            });
    </script>
</body>
</html>
